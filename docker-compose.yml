services:
  backend:
    build:
      context: ./back
    container_name: effective_mobile_back
    expose:
      - "8080"
    networks:
      - effective_mobile_network
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    container_name: effective_mobile_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - effective_mobile_network
    restart: unless-stopped

networks:
  effective_mobile_network:
    driver: bridge
